
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Coral Reef Explorer</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>Coral Reef Explorer</h1>
        <p>Discover the underwater world</p>
    </header>

    <main>
        <section class="explorer">

            <div class="game-container">
                <iframe
                    id="reefGame"
                    src="web101/index.html"
                    allow="fullscreen; autoplay"
                    title="3D Coral Reef Explorer">
                </iframe>
            </div>

            <div class="controls">
                <p><strong>Explore using:</strong></p>
                <span>W A S D – Movement</span>
                <span>Mouse – Look around</span>
                <span>Space – Swim up</span>
                <span>Ctrl – Swim down</span>
            </div>

        </section>
    </main>

    <script src="script.js"></script>

</body>
</html>
